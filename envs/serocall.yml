# Runtime dependencies for SeroCall (cloned into tools/SeroCall).
# NOTE: despite the README claiming Python 2.7+/3+ support, the bundled
# serocall.py uses Python-2-only `print` statements, so it must run under
# Python 2.7 (bincounts.py is py3-clean, but serocall.py is not). Pinning
# python=2.7 here; serocall.py only needs the stdlib.
# (Samtools is only needed to rebuild the reference DB, which we don't do —
#  the clone ships a pre-built BWA index in data/.)
name: serocall
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=2.7
  - bwa>=0.7.15
